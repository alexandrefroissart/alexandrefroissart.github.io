name: Big Update
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.retry == 'true' && 'Big Update (retry)' || 'Big Update' }}

on:
  # 1. Mise à jour des données (Planifiée)
  schedule:
    # Exécution : 00h, 04h, 08h, 12h, 16h, 20h (Heure Française, Europe/Paris)
    # GitHub Actions utilise UTC pour les schedules, on déclenche donc:
    # - CET (UTC+1) : 23h, 03h, 07h, 11h, 15h, 19h
    # - CEST (UTC+2): 22h, 02h, 06h, 10h, 14h, 18h
    # Un garde-fou dans le job vérifie l'heure locale Paris pour éviter les runs "hors horaires".
    - cron: '0 23,3,7,11,15,19 * * *'
    - cron: '0 22,2,6,10,14,18 * * *'
  # 2. Déploiement du site (Sur modification)
  push:
    branches: ["main"]
  # 3. Manuel
  workflow_dispatch:
    inputs:
      retry:
        description: "Auto retry after runner acquisition failure"
        required: false
        default: "false"

permissions:
  contents: write      # Pour commiter les mises à jour de données
  pages: write         # Pour déployer sur GitHub Pages
  id-token: write      # Pour l'authentification OIDC Pages
  actions: read        # Pour inspecter les artifacts Pages (retry robuste)

jobs:
  # JOB 1 : MISE À JOUR DES DONNÉES (Seulement sur Schedule ou Manuel)
  update-data:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      data_changed: ${{ steps.git-check.outputs.changed }}
      should_run: ${{ steps.timecheck.outputs.should_run }}
    env:
      ROOTME_API_KEY: ${{ secrets.ROOTME_API_KEY }}
      ROOTME_STRICT: "1"
      ROOTME_SCRAPE_HTML: "0"
    steps:
      - name: Check France time window
        id: timecheck
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hour=$(TZ=Europe/Paris date +%H)
          case "$hour" in
            00|04|08|12|16|20)
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Checkout repository
        if: steps.timecheck.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.timecheck.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.timecheck.outputs.should_run == 'true'
        run: python -m pip install beautifulsoup4

      - name: Fetch Root-Me & SadServers Data
        if: steps.timecheck.outputs.should_run == 'true'
        run: python3 scripts/fetch-rootme.py

      - name: Check for changes
        id: git-check
        if: steps.timecheck.outputs.should_run == 'true'
        run: |
          git diff --quiet data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.timecheck.outputs.should_run == 'true' && steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git commit -m "🔄 Update Data (Big Update)"
          git push

  # JOB 2 : DÉPLOIEMENT DU SITE
  # Dépend de update-data si schedule/workflow_dispatch, sinon s'exécute directement sur push
  deploy:
    runs-on: ubuntu-latest
    needs: [update-data]
    # S'exécute toujours après update-data (même si skip/fail), ou directement sur push
    if: >-
      always() &&
      (
        (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
        needs.update-data.outputs.should_run == 'true'
      )
    concurrency:
      group: "pages"
      cancel-in-progress: true
    steps:
      - name: Checkout (with latest changes)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          # Force re-fetch pour avoir les derniers commits (de update-data)
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin main

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.154.5"
          extended: true

      - name: Build
        run: hugo --minify --config hugo.yaml

      - name: Upload artifact (attempt 1)
        id: upload1
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: ./public

      - name: Check pages artifact exists
        id: artifact_check_1
        if: steps.upload1.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId,
              per_page: 100,
            });
            const exists = (data.artifacts || []).some(a => a && a.name === 'github-pages');
            core.setOutput('exists', exists ? 'true' : 'false');

      - name: Upload artifact (attempt 2)
        id: upload2
        if: steps.upload1.outcome == 'failure' && steps.artifact_check_1.outputs.exists != 'true'
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: ./public

      - name: Fail if artifact upload failed
        if: >-
          steps.upload1.outcome == 'failure' &&
          (
            steps.artifact_check_1.outputs.exists != 'true' &&
            (steps.upload2.outcome == 'failure' || steps.upload2.outcome == 'skipped')
          )
        run: exit 1

      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        if: steps.upload1.outcome == 'success' || steps.upload2.outcome == 'success' || steps.artifact_check_1.outputs.exists == 'true'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if deploy failed
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: exit 1
