name: Retry Big Update Once

on:
  workflow_run:
    workflows: ["Big Update"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled') &&
      github.event.workflow_run.event != 'workflow_dispatch' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Rerun once
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.payload.workflow_run.id;
            const conclusion = context.payload.workflow_run.conclusion;

            core.info(`Rerun policy: run_attempt==1, conclusion=${conclusion}, run_id=${runId}`);

            if (conclusion === 'failure') {
              await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs', {
                owner,
                repo,
                run_id: runId,
              });
              core.info('Triggered rerun failed jobs.');
              return;
            }

            if (conclusion === 'cancelled') {
              await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun', {
                owner,
                repo,
                run_id: runId,
              });
              core.info('Triggered rerun.');
              return;
            }

            core.info('Nothing to do.');
