name: Retry Big Update Once

on:
  workflow_run:
    workflows: ["Big Update"]
    types: [completed]

permissions:
  actions: write
  contents: read
  checks: read

jobs:
  retry:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled') &&
      github.event.workflow_run.event != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check runner acquisition failure
        id: reason
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.payload.workflow_run.id;
            const message = 'The job was not acquired by Runner of type hosted even after multiple attempts';

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: runId,
              per_page: 100,
            });

            let shouldRetry = false;

            for (const job of jobs) {
              if (!job.check_run_url) {
                continue;
              }

              const checkRunId = Number(job.check_run_url.split('/').pop());
              if (!checkRunId) {
                continue;
              }

              const { data: checkRun } = await github.rest.checks.get({
                owner,
                repo,
                check_run_id: checkRunId,
              });

              if (!checkRun.output || !checkRun.output.annotations_url) {
                continue;
              }

              const annotations = await github.paginate(github.rest.checks.listAnnotations, {
                owner,
                repo,
                check_run_id: checkRunId,
                per_page: 100,
              });

              if (annotations.some((annotation) => (annotation.message || "").includes(message))) {
                shouldRetry = true;
                break;
              }
            }

            core.setOutput('should_retry', shouldRetry ? 'true' : 'false');

      - name: Dispatch retry
        if: steps.reason.outputs.should_retry == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'big-update.yml',
              ref: 'main',
              inputs: { retry: 'true' },
            });
