{{- $defaultColorScheme := default "auto" .Site.Params.colorScheme.default -}}
{{- if not (default false .Site.Params.colorScheme.toggle) -}}
    <script>
        (function () {
            const colorSchemeKey = "StackColorScheme";
            localStorage.setItem(colorSchemeKey, "{{ $defaultColorScheme }}");
        })();
    </script>
{{- else -}}
    <script>
        (function () {
            const colorSchemeKey = "StackColorScheme";
            if (!localStorage.getItem(colorSchemeKey)) {
                localStorage.setItem(colorSchemeKey, "{{ $defaultColorScheme }}");
            }
        })();
    </script>
{{- end -}}

<script>
    (function () {
        const colorSchemeKey = "StackColorScheme";
        const isMobile = window.matchMedia("(max-width: 1023px)").matches;
        const current = localStorage.getItem(colorSchemeKey);

        // Sur mobile, on force sombre par défaut tant que l'utilisateur n'a pas explicitement choisi "light".
        if (isMobile && (!current || current === "auto")) {
            localStorage.setItem(colorSchemeKey, "dark");
        }
    })();
</script>

<script>
    (function () {
        const colorSchemeKey = "StackColorScheme";
        const colorSchemeItem = localStorage.getItem(colorSchemeKey);
        const supportDarkMode = window.matchMedia("(prefers-color-scheme: dark)").matches === true;

        if (colorSchemeItem === "dark" || (colorSchemeItem === "auto" && supportDarkMode)) {
            document.documentElement.dataset.scheme = "dark";
        } else {
            document.documentElement.dataset.scheme = "light";
        }
    })();
</script>
